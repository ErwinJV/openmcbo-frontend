services:
  nextjs-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API=http://localhost:3300
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=http://localhost:3300/graphql
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
